# Déploiement sur un VPS, en complément du docker-compose.yml du projet.
#
# Toujours lancer les deux fichiers ensemble (le script deploy/compose.sh le fait) :
#   docker compose -f docker-compose.yml -f deploy/docker-compose.vps.yml up -d
#
# Ce que ce fichier change par rapport à l'installation standard :
#   - plus aucun port de la base, du serveur ni de l'appli n'est ouvert sur
#     Internet : seul Caddy écoute (80/443) ;
#   - Caddy obtient et renouvelle tout seul le certificat HTTPS (Let's Encrypt),
#     indispensable pour installer l'appli sur les téléphones et recevoir les
#     notifications ;
#   - une sauvegarde de la base est faite chaque jour dans ./backups.
#
# Les services eux-mêmes (variables, images) restent ceux de docker-compose.yml :
# les mises à jour du projet s'appliquent donc sans retoucher ce fichier.
# Nécessite Docker Compose 2.24 ou plus récent (balise !reset).

# Journaux Docker limités à 3 × 10 Mo par service : sans limite, ils
# grossissent indéfiniment sur le disque du VPS.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
    logging: *logging

  server:
    ports: !reset []
    logging: *logging

  client:
    ports: !reset []
    logging: *logging
    build:
      args:
        # Nom affiché sous l'icône de l'appli installée (APP_NAME dans .env).
        VITE_APP_NAME: ${APP_NAME:-OpenFamily}
    volumes:
      # nginx retrouve l'adresse IP réelle des visiteurs derrière Caddy. Sans
      # cela, toute la famille partagerait le même compteur anti-force brute :
      # dix mots de passe mal tapés par une personne bloqueraient tout le monde.
      - ./deploy/nginx-real-ip.conf:/etc/nginx/conf.d/00-real-ip.conf:ro

  caddy:
    image: caddy:2-alpine
    container_name: openfamily-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?Renseignez ACME_EMAIL dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client

  backup:
    image: postgres:16-alpine
    container_name: openfamily-backup
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-openfamily}
      PGUSER: ${POSTGRES_USER:-openfamily}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Fixé pour que nginx-real-ip.conf ne fasse confiance qu'à ce réseau
        # interne, où seul Caddy peut lui parler.
        - subnet: 172.28.0.0/24

volumes:
  caddy-data:
  caddy-config:
